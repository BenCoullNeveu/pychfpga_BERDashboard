#  Template python-build

#  This template allows you to validate your python code.
#  The workflow allows running tests and code linting on the default branch.

image: python:3.8

pipelines:
  default:
    - parallel:
      - step:
          name: Automatic test
          # Test which require no configuaration of hardware components and are therefore platform agnostic
          caches:
            - pip
          script:
            - if [ -f pyproject.toml ]; then pip install -e .; fi
            - pip install pytest
            - pytest -v software_tests/automatic_tests/*
      - step:
          name: Lint code
          script:
            # Enforce style consistency across Python projects https://flake8.pycqa.org
            - pip install flake8
            # - flake8 . --extend-exclude=dist,build --statistics

      - step:
          name: Manual test
          # Test which require manual configuration of hardware components
          trigger: manual
          caches:
            - pip
          script:
            - if [ -f pyproject.toml ]; then pip install -e .; fi
            - pip install pytest
            - pytest -v software_tests/manual_tests/*
