flaginput:
    sources: ['layout', 'manual', 'power', 'rms', 'raw']
    combine: ['layout', 'manual', 'power', 'rms', 'raw']
    correlator: 'chime'
    output_dir: '/data/flaginput'
    output_suffix: 'flaginput'
    always_return_metrics: True
    metric_encoding: 'text'
    max_file_size: 100000000
    max_num_time:
    memory_size: 128
    max_threadpool_workers: 16
    sources_in_buffer: False
    niceness: 10
    port: 54327
    sync_delay: 10.0
    consumers:
        - {hostname: 'csBfs', port: 54323}
    layout:
        cadence: 300.0
    power:
        cadence: 215.0
        clients:
            - {hostname: 'hk-west', port: 5000, bulkheads: ['A', 'B']}
            - {hostname: 'hk-east', port: 5000, bulkheads: ['C', 'D']}
    rms:
        cadence: 30.0
        clients:
            - {hostname: 'carillon', port: 54322}
        lower_limit: 4.0
        upper_limit: 42.0
        nsigma: 7.0
        group_by_cyl: False
        group_by_pol: True
        num_consecutive_bad: 1
        num_consecutive_good: 8
        max_rate: 2.0
        trial_period: 1.0
    rfi:
        cadence: 60.0
        clients:
            - {hostname: 'carillon', port: 7342}
        threshold: 20.0
    raw:
        cadence: 40.0
        acq_dir: '/mnt/gong/archive'
        acq_suffix: 'rawadc'
        output_dir: '/data/rawflag'
        output_suffix: 'rawflag'
        always_return_metrics: True
        metric_encoding: 'text'
        max_file_size: 100000000
        max_num_time:
        memory_size: 1
        start_time:
        lifo: False
        classification_threshold: 0.01
        num_consecutive_bad: 2
        num_consecutive_good: 24
    periodic_callbacks: ['historical_status']
    historical_status:
        method: '_update_historical_status'
        cadence: 3600.0
        num_days_lookback: 14
    rms_excludes:
        method: '_update_rms_excludes'
        cadence: 43200.0
        excludes:
            sun: 1800.0
