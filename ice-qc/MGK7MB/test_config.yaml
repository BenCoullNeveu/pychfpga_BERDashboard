ready_check: 1 #If this is set to 0, the tests can be strung together without lots of prompting
#For example:
#Tests 3-4 : Require backplane + PLL programmer in place
#Tests 5-8 : Requires backplane + ARM Ethernet + Flashcard + RS232 cable
#Test 9: solo test
#Test 10: solo test
#Test 11-14 : Requires backplane + ARM Ethernet + Flashcard + SPF(FPGA ethernet) + Heatsink + QSFP cable + Mezzanines (PLL programmer and RS232 cable can be left in place)


# test_results_folder: ""  # don't specify here to use value pased by the previous menu
# test_results_folder_uses_git: false  # don't specify here to use value pased by the previous menu
# xml_test_results_pathname: # relative to test_results_folder, don't speficy to get default pattern "./{model}/{model}_SN{serial}/data/{isodate}_{session_name}.xml"
model_number: 'MGK7MB'

fpga_bit_file: '../../pychfpga/fpga_firmware/bitstreams/SIFPGA_MGK7MB.bit'
fpga_firmware_mode: 'shuffle16'

#For changing prologix address, use ./nfcli --list to find devices
instruments:
    dmm:       {labpy_object: 'agilent_dmm', adapter: "TCPIP::IDN::*34410*"} # Agilent 34410A multimeter
    ps16v:     {labpy_object: 'siglentspd1000x', adapter: 'TCPIP::10.10.10.149'}

#   TODO: Add SPD1168X DC programmable power supply to components list
#   ps18v:     {labpy_object: 'agilent_N5700', interface: 'lan', ip_addr: '11.11.11.73', gpib_addr: 5}  # Agilent N5764A power supply


?: &default_fpga_array
    iceboards: 0047
    mdns_delay: 1

test_results_folder: '~/iceboard/iceqc/iceqc/dev/'
git_repo_path: '/home/antoine_p/iceboard/iceqc/iceqc'

test_list:
    # This list all the tests that will be done by the test software, in the proper order
    # path is the argument given to nose to find the test fucntion, in the form of module_path:function or module_path:class.method
    # This path is also the path used by XReport to identify tests results, with the exception that the semicolon ':' is replaced by a dot '.'
    insp:  {description: 'Inspection test',          path: 'mgk7mb_test.py::TestMGK7MBBench::test_insp',       required: yes, require_serial_number: yes, dependencies: null}
    res:   {description: 'Resistance test',          path: 'mgk7mb_test.py::TestMGK7MBBench::test_res',        required: yes, require_serial_number: yes, dependencies: insp}
    powup: {description: 'Powerup test',             path: 'mgk7mb_test.py::TestMGK7MBBench::test_powerup',    required: yes, require_serial_number: yes, dependencies: res}
    pll:   {description: 'Program PLL',              path: 'mgk7mb_test.py::TestMGK7MBBench::test_pll',        required: yes, require_serial_number: yes, dependencies: powup}
    mem:   {description: 'Test ARM memory',          path: 'mgk7mb_test.py::TestMGK7MBBench::test_mem',        required: yes, require_serial_number: yes, dependencies: pll}
    ser:   {description: 'Save serial number',       path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_ser',      required: yes, require_serial_number: yes, dependencies: mem}
    clk:   {description: 'Clock testing',            path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_clock',    required: yes, require_serial_number: yes, dependencies: ser}
    i2c:   {description: 'ARM i2c bus tests',        path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_i2c',      required: yes, require_serial_number: yes, dependencies: clk}
    sens:  {description: 'Read board power sensors', path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_sens',     required: yes, require_serial_number: yes, dependencies: i2c}
    fpga:  {description: 'FPGA tests',               path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_fpga',     required: yes, require_serial_number: yes, dependencies: sens}
    qsfp:  {description: 'QSFP testing',             path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_qsfp',     required: yes, require_serial_number: yes, dependencies: fpga}
    gtx:   {description: 'GTX testing',              path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_gtx',      required: yes, require_serial_number: yes, dependencies: qsfp}
    mezz:  {description: 'Basic mezz test',          path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_mezz',     required: yes, require_serial_number: yes, dependencies: gtx}
    rmp:   {description: 'Ramp testing',             path: 'mgk7mb_test.py::TestMGK7MBNetwork::test_ramp',      required: yes, require_serial_number: yes, dependencies: mezz}

menu:
    # The menu item will match the user input to either the 'key' field or to the regular expression 'regex'. The matching dictionary is returned.
    # If a regular expression is given, string parameters are replaced by string_param.format(regex_matched_group_list), i.e. '{0}' is replaced by the first matched group etc. The 'key' and 'regex' fields are excluded from this conversion.
    # Entry types are:
    #  test: a test to run. test_tag refers to the test to run in test_list (defined above). A regex entry will be added to match the tets tag and tets path. The description will be taken from the test description if none is provided here.
    #  exit: exit the menu
    #  text: do nothing. The description is shown in the menu if there is one.
    #  board_info: Sets the current board model and serial number. The serial number can be extracted from string parsed by the regex
    #
    - { description: "Start by entering the MB's serial number, then select a test or range of tests (e.g. 10-13).",     type: text}
    - { key: '1',                    action: run_test, test_tag: insp}
    - { key: '2',                    action: run_test, test_tag: res}
    - { key: '3',                    action: run_test, test_tag: powup}
    - { key: '4',                    action: run_test, test_tag: pll}
    - { key: '5',                    action: run_test, test_tag: mem}
    - { key: '6',                    action: run_test, test_tag: ser}   #used to be test 8, now is 6
    - { key: '7',                    action: run_test, test_tag: clk}   #used to be test 9, now is 7
    - { key: '8',                    action: run_test, test_tag: i2c}   #used to be test 6, now is 8
    - { key: '9',                    action: run_test, test_tag: sens}  #used to be test 7, now is 9
    - { key: '10',                   action: run_test, test_tag: fpga}
    - { key: '11',                   action: run_test, test_tag: qsfp} #used to be test 12, now is 11
    - { key: '12',                   action: run_test, test_tag: gtx}  #used to be test 14, now is 12
    - { key: '13',                   action: run_test, test_tag: mezz} #used to be test 11, now is 13
    - { key: '14',                   action: run_test, test_tag: rmp}  #used to be test 13, now is 14
    - { regex: '(\d+\-\d+)',         action: run_range,   input: '{0}'} # regex to select a range of options
    - { regex: '(0\d{3})',                             model: 'MGK7MB', serial: '{0}', next_key: '1'}  # 0nnn are MGK7MB Serial number
    - { regex: '38355-0000-(\d{4})',                   model: 'MGK7MB', serial: '{0}', next_key: '1'}  #38355-0000-nnnn are MGK7MB Serial nnnn
    - { key: 'S',                    action: push,    description: 'Send all new test results data to McGill'}
    - { key: 'R',                    action: summary, description: 'Generate summary of all tests'           }
    - { key: 'Q',                    action: exit,    description: 'Exit'                                    }


##################################
# Test-specific parameters
##################################

motherboard_tests:
    global_settings:
         eth_interface: 'enp4s0' # name of ethernet interface on which the IceBoard is connected. Used to check jumbo frames.
         ps_voltage: 18  # Volts. Voltage to set on the Iceboard power supply 
         ps_current: 5   # Amps. Maximum current limit to set on the Iceboard power sypplt 

    inspection:

        #Questions for visual inspection of the board
        questions:
            - Is the FPGA heatsink attached? With pushpins holding it firmly in place [Y/N]? 
            - Is the FPGA heatsink model correct? Pins cut near stiffener [Y/N]? 
            - Is the board Stiffener installed, and the board is reasonably flat[Y/N]? 
            - Are the PLL heatsinks attached [Y/N]? 
            - Does the ARM shield fence look straight [Y/N]? 
            - Are the dipswitches set correctly [Y/N]? 
            - Are the jumpers placed correctly [Y/N]? 
            - Are the 90pin Molex impact backplane connectors screwed down [Y/N]? 
            - Are the QSFP and SFP connectors soldered in place [Y/N]? 
            - Do all buck converter sensors have the additional hand soldered capacitor [Y/N]? 
            #   ---
            #   Not strictly necessary since GTX test tests these connections:
            #             "Please inspect the GTX backplane connector pins on the back of the board (you will need the microscope). " \
            #                 "Are they all perfect? i.e none of them bent or unusual [Y/N]? ",
            #   ---
            - Do all the FMC power switches look well soldered [Y/N]?
            - Is the patch wire in place and secured [Y/N]?

    impedance:
        max_impedance: 1.0e+10  # any measurement more than this is probably not taken correctly
        test_points:
        # delay: delay to wait before taking the measurement
        # zmin: minimum impedance below which the test will fail
           - ['+V (P18)',       {delay: 0.2, zmin: 250}]
           - ['12V (L3)',       {delay: 0.2, zmin: 250}]
           - ['Vadj (L11)',     {delay: 0.2, zmin: 250}]
           - ['3.3V (L1)',      {delay: 0.2, zmin: 15}]
           - ['5V (L4)',        {delay: 0.2, zmin: 250}]
           - ['1V Gt. (L5)',    {delay: 0.2, zmin: 13}]
           - ['1.2V Gt. (L6)',  {delay: 0.2, zmin: 150}]
           - ['1V Co. (L8)',    {delay: 0.2, zmin: 13}]
           - ['1.5V (L7)',      {delay: 0.2, zmin: 200}]
           - ['1.8V (L9)',      {delay: 0.2, zmin: 150}]

    powerup:
        # manual_ps: true
        power_sup: 'ps16v'
        imax: 1.0
        imin: 0.5

    pll:

        # URL to identify and connect to the FTDI USB-to-UART or MPSSE cable
        # format ftdi://[vendor][:[product][:serial|:bus:address|:index]]/interface
        #   vendor: ftdi or 0x403
        #   product: 232, 232r, 232h, 2232d, 2232h, 4232h, 230x or 0x6001, 0x6010, 0x6011, 0x6014, 0x6015
        #   serial (optional): the serial number as a string, if the device has a EEPROM
        #   interface: 1 of 230x and 232*, 1-2 for 2232*, 1-4 for 4232*
        # See https://eblot.github.io/pyftdi/urlscheme.html
        # Note :McGill FTDI cable info: Model: C232HM-DDHSL-0, Serial: FTXQWE8U. Yellow tape, DEFECT tag (but works).
        #       URL: 'ftdi://::FTXQWE8U/1'
        #       There is another one SN FTVR3DME (ftdi://::FTVR3DME/1) 
        ftdi_url: 'ftdi://ftdi:232h:FTXQYGNU/1'  # Any ft232h cable 
        pll1regs:
            - 0x01260320
            # - 0x01260321 # bad value for testing 
            - 0xEB060301
            - 0x011E0302
            - 0xEB040303
            - 0xEB860314
            - 0x101C1E75
            - 0x849F4FE6
            - 0xBDB23BE7
            #- 0x20009CF8
        pll2regs:
            - 0xEB840320
            - 0xEB840301
            - 0xEB840302
            - 0xEB860303
            - 0xEB400014
            - 0x101C1E75
            - 0x84BF49A6
            - 0xBDB23BE7
            #- 0x20009DD8

    mem_test:
        # URL to connect to the FTDI USB to serial cable.
        # See pll_test for more details.
        # ftdi_url: 'ftdi://ftdi:0x6015/1' # Digico cable  
        #ftdi_url: 'ftdi://ftdi:232h/1'  # PLL cable
        ftdi_url: 'ftdi://ftdi:ft-x:FT0N9TN0/1'  # RS232 cable

    sensors:

        sensor_names:
            - {name: 'VCC3V3',     board_name: 'MOTHERBOARD_RAIL_VCC3V3'}
            - {name: 'VCC12V0',    board_name: 'MOTHERBOARD_RAIL_VCC12V0'}
            - {name: 'VCC5V5',     board_name: 'MOTHERBOARD_RAIL_VCC5V5'}
            - {name: 'VCC1V0_GTX', board_name: 'MOTHERBOARD_RAIL_VCC1V0_GTX'}
            - {name: 'VCC1V0',     board_name: 'MOTHERBOARD_RAIL_VCC1V0'}
            - {name: 'VCC1V2',     board_name: 'MOTHERBOARD_RAIL_VCC1V2'}
            - {name: 'VCC1V5',     board_name: 'MOTHERBOARD_RAIL_VCC1V5'}
            - {name: 'VCC1V8',     board_name: 'MOTHERBOARD_RAIL_VCC1V8'}
            - {name: 'VADJ',       board_name: 'MOTHERBOARD_RAIL_VADJ'}

        current:
            VCC3V3:     {nom: 2.00,  pmargin: 0.30,  amargin: 0}     # 30%
            VCC12V0:    {nom: 0.00,  pmargin: 0.0,  amargin: 0.1}   # +-100mA (2021-04-11 JFC Change to +-100mA like in the comment)
            VCC5V5:     {nom: 1.069, pmargin: 0.30,  amargin: 0}     # 30%
            VCC1V0_GTX: {nom: 3.8,   pmargin: 0.00,  amargin: 4}  # +-1A (Change by R.Dubois for A.Gilbert 170922)
            VCC1V0:     {nom: -3.8,   pmargin: 0.00,  amargin: 4}   # +-1A (Change by R.Dubois for A.Gilbert 170922)
            VCC1V2:     {nom: 0.020, pmargin: 0.00,  amargin: 0.020} # +-20mA
            VCC1V5:     {nom: 1.644, pmargin: 0.30,  amargin: 0}     # 30%
            VCC1V8:     {nom: 0.275, pmargin: 0.70,  amargin: 0}     # 30% #widened margin to 70%, tested value was too low, TODO review change with JF
            VADJ:       {nom: 0.023, pmargin: 0.00,  amargin: 0.03}  # +-30mA

        voltage:
            VCC3V3:     {nom: 3.3,   pmargin: 0.05,  amargin: 0}     # 5%
            VCC12V0:    {nom: 12,    pmargin: 0.05,  amargin: 0}     # 5%
            VCC5V5:     {nom: 5.5,   pmargin: 0.05,  amargin: 0}     # 5%
            VCC1V0_GTX: {nom: 1.05,  pmargin: 0.05,  amargin: 0}     # 5%
            VCC1V0:     {nom: 1,     pmargin: 0.055,  amargin: 0}     # 5% (2021-07-21 JFC: increases to 5.5% to allow coule of boards to pass)
            VCC1V2:     {nom: 1.2,   pmargin: 0.05,  amargin: 0}     # 5%
            VCC1V5:     {nom: 1.5,   pmargin: 0.05,  amargin: 0}     # 5%
            VCC1V8:     {nom: 1.8,   pmargin: 0.05,  amargin: 0}     # 5% 
            VADJ:       {nom: 2.5,   pmargin: 0.05,  amargin: 0}     # 5%

        temp:
            POWER:      {nom: 30,     pmargin: 0.00,  amargin: 25}   # +-25 C
            FPGA:       {nom: 30,     pmargin: 0.00,  amargin: 25}   # +-25 C
            ARM:        {nom: 30,     pmargin: 0.00,  amargin: 25}   # +-25 C
            PHY:        {nom: 30,     pmargin: 0.00,  amargin: 25}   # +-25 C

        fmccurrent:
            VCC3V3:     {nom: 0,     pmargin: 0.00,  amargin: 0.005}   # +-5mA
            VCC12V0:    {nom: 0,     pmargin: 0.00,  amargin: 0.005}   # +-5mA
            VADJ:       {nom: 0,     pmargin: 0.00,  amargin: 0.005}   # +-5mA

        fmcvoltage:
            VCC3V3:     {nom: 3.3,   pmargin: 0.05,  amargin: 0}     # 5%
            VCC12V0:    {nom: 12,    pmargin: 0.05,  amargin: 0}     # 5%
            VADJ:       {nom: 2.5,   pmargin: 0.05,  amargin: 0}     # 5%

        fmcoffvoltage:
            VCC3V3:     {nom: 0.4,   pmargin: 0.00,  amargin: 0.4}     # +-0.4V
            VCC12V0:    {nom: 2.0,   pmargin: 0.00,  amargin: 2.0}     # was +-0.4V. 2021-05-12 JFC changed to 0-2V because the rail takes a long time (30s) to dscharge. Other rails are ok 
            VADJ:       {nom: 0.4,   pmargin: 0.00,  amargin: 0.4}     # +-0.4V

    ser_test:
        rev: 4  # Board revision number to program into the IPMI EEPROM

    i2c_test:

        motherboard_names:

            matrix_names:
                # pca9548-1-70: '1-0070'
