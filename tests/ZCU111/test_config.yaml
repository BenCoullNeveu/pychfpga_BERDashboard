adc_tests:
    setup: # These are parameters common to all carrier tests

    test_histogram:
        fpga_array_params: {<<: *default_fpga_array_params, prog: 1, open: 1, bitfile: siFPGA}




    spi_pll_test:
        # instruments: [dmm] # Subset of instruments we use in these tests
        fpga_array: {<<: *default_fpga_array_params, no_mezz: false, prog: 1,  open: 1}

        pcb_temp: {tmin: 10, tmax: 60, iterations: 10}
        adc_temp: {tmin: 10, tmax: 85, iterations: 10}
        valid_adc_chip_id: [0x0119]
        blink_delay: 0.2  # Time between LED blinks

        pll_iterations: 2
        pll_gate_time: 0.1
        pll_frequencies: [800, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000]  # Frequencies in MHz, range is
        pll_freq_err_max: 0.000001 # in MHz. We have a gate time of 0.01s, err =

        test_mgt_pll: false  # This test does not always work yet.
        pll2_iterations: 2
        pll2_gate_time: 0.1
        pll2_frequencies: [10, 20, 50, 100, 125, 156.25, 200, 250, 312.5, 400, 600]  # Frequencies in MHz, range is 5 to 1000 MHz
        pll2_freq_err_max: 0.000001 # in MHz. We have a gate time of 0.01s, resolution = 160 Hz

    ramp_test:
        # instruments: [dmm] # Subset of instruments we use in these tests
        fpga_array: {<<: *default_fpga_array_params, prog: 1,  open: 1}

    s11_test:
        instruments: [na] # Subset of instruments we use in these tests
        dummy_instruments: no
        fpga_array: {<<: *default_fpga_array_params, prog: 1,  open: 1, adc_bandwidth=1}
        s11_max : -15 # in dB # CHIME
        # fpga_array: {<<: *default_fpga_array_params, prog: 1,  open: 1, adc_bandwidth=1} # CHORD
        # s11_max : -10 # in dB # CHORD

        adc_trim_value: null  # 0-15, default is 8. null= no change. Was 15 for many mezzannes. Applies to all channels.
        channels: [1,2,3,4,5,6,7,8] # ADC channels to test , as labeled on the board
        # frequency response measurement parameters
        number_of_frames: 1

        # CHIME
        freqs: [17, 47, 93,  153, 207, 307, 353, 407, 507, 553, 653, 707, 753, 807, 853, 907, 953, 1007, 1047, 1065, 1107, 1147, 1165, 1207]  # MHz
        # CHORD
        # freqs: [17, 47, 93,  153, 207, 307, 353, 407, 507, 553, 653, 707, 753, 807, 853, 907, 953, 1007, 1047, 1065, 1107, 1147, 1165, 1207, 1288, 1333, 1407, 1475, 1523, 1608, 1663, 1704]  # MHz
        power_level: -6 # dBm  # stimulus power
        expected_frequency_response: [[200, -3], [900, -6]]
