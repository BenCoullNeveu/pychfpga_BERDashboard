# test_results_folder: ""  # don't specify here to use value pased by the previous menu
# test_results_folder_uses_git: false  # don't specify here to use value pased by the previous menu
# xml_test_results_pathname: # relative to test_results_folder, don't speficy to get default pattern "./{model}/{model}_SN{serial}/data/{isodate}_{session_name}.xml"

model_number: 'ZCU111' # required to run the tests (generate data folder name, configure EEPROM etc.)
default_serial: null

instruments:
    # Digico setup 
    sg:        {labpy_object: 'RigolDSG800',  adapter: 'TCPIP::VXI11::IDN::*Rigol*DSG821*DSG8J215200084*'} # signal generator


fpga_array_params: &default_fpga_array_params
    hwm: 'ZCU111 001'

test_list:
    # This list all the tests that will be done my the test software, in the proper order
    # path is the argument given to nose to find the test fucntion, in the form of module_path:function or module_path:class.method
    # This path is also the path used by XReport to identify tests results, with the exception that the double semicolon '::' is replaced by a dot '.'
    imp: {description: 'Impedance test (needs S/N)',               path: 'mgadc08_bench_tests.py::TestMGADC08Bench::test_impedance', required: yes, require_serial_number: yes, dependencies: null}
    smk: {description: 'Smoke test (needs S/N)',                   path: 'mgadc08_bench_tests.py::TestMGADC08Bench::test_smoke',     required: yes, require_serial_number: yes, dependencies: imp}
    eep: {description: 'EEPROM Programming and test (needs S/N)',  path: 'mgadc08_bench_tests.py::TestMGADC08Carrier::test_eeprom',  required: yes, require_serial_number: yes, dependencies: smk}
    pow: {description: 'Power test',                               path: 'mgadc08_bench_tests.py::TestMGADC08Carrier::test_power',   required: yes, require_serial_number: no, dependencies: smk}
    spi: {description: 'SPI & PLL test',                           path: 'mgadc08_bench_tests.py::TestMGADC08Carrier::test_spi_pll', required: yes, require_serial_number: no, dependencies: smk}
    rmp: {description: 'Ramp test',                                path: 'mgadc08_bench_tests.py::TestMGADC08Carrier::test_ramp',    required: yes, require_serial_number: no, dependencies: smk}
    s11: {description: 'S11 test',                                 path: 'mgadc08_bench_tests.py::TestMGADC08Carrier::test_s11',     required: yes, require_serial_number: no, dependencies: smk}


menu:
    # The menu item will match the user input to either the 'key' field or to the regular expression 'regex'. The matching dictionary is returned.
    # If a regular expression is given, string parameters are replaced by string_param.format(regex_matched_group_list), i.e. '{0}' is replaced by the first matched group etc. The 'key' and 'regex' fields are excluded from this conversion.
    # Entry types are:
    #  test: a test to run. test_tag refers to the test to run in test_list (defined above). A regex entry will be added to match the tets tag and tets path. The description will be taken from the test description if none is provided here.
    #  exit: exit the menu
    #  text: do nothing. The description is shown in the menu if there is one.
    #  board_info: Sets the current board model and serial number. The serial number can be extracted from string parsed by the regex
    #
    - { key: '1',                    action: run_test, test_tag: imp}
    - { key: '2',                    action: run_test, test_tag: smk}
    - { key: '3',                    action: run_test, test_tag: eep}
    - { key: '4',                    action: run_test, test_tag: pow}
    - { key: '5',                    action: run_test, test_tag: spi}
    - { key: '6',                    action: run_test, test_tag: rmp}
    - { key: '7',                    action: run_test, test_tag: s11}
    - { key: 'S',                    action: push, description: 'Send all new test results data to McGill'}
    - { key: 'U',                    action: update, description: 'Force summary report update for the current DUT (normally done automatically)' }
    - { key: 'R',                    action: summary, description: 'Generate combined summary for all available DUTs'                       }
    - { key: 'Q',                    action: exit, description: 'Exit'                                                }
    - {                              action: text, description: "or Enter or scan board's serial number or menu item" }
    - { regex: '45844-0000-(\d{4})', action: board_info, model: 'MGADC08', serial: '{0}', next_key: '1'}  # 29821-0000-nnnn are MGADC08 Serial nnnn
    - { regex: '29821-0000-(\d{4})', action: board_info, model: 'MGADC08', serial: '{0}', next_key: '1'}  # 29821-0000-nnnn are MGADC08 Serial nnnn
    - { regex: '35896-0000-(\d{4})', action: board_info, model: 'MGADC08', serial: '{0}', next_key: '1'}  # 35896-0000-nnnn are MGADC08 Serial nnnn
    - { regex: '38161-0000-(\d{4})', action: board_info, model: 'MGADC08', serial: '{0}', next_key: '1'}  # 38161-0000-nnnn are MGADC08 Serial nnnn
    - { regex: '(0\d{3})',           action: board_info, model: 'MGADC08', serial: '{0}', next_key: '1'}  # 0nnn are MGADC08 Serial nnnn
    - { regex: '(\d+\-\d+)',         action: range, input: '{0}'} # regex to select a range of options


