[pytest]
# needed to include all stdout text into the xml report
# Put before addopts. Somehow it is ignored after if it has spaces around '='.
junit_logging = all

addopts = --xreport-path="../../../zcu111_test_results/{model}_SN{serial}/test_runs/{isodate}_{session_name}.xml" --xreport-config="test_config.yaml" --xreport-verbose 1 --xreport-summary="../../../zcu111_test_results/{model}_SN{serial}/{model}_SN{serial}.xml" --capture=tee-sys --log-level=info --tb=short --show-capture=no

