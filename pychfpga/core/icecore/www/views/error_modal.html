<!-- Alert block -->
<div class="ng-modal" ng-show="show_error_modal">
	<div class="ng-modal-overlay" />
	<div class="ng-modal-dialog" ng-style="dialogStyle">
		<div class="ng-modal-dialog-content">
			<div style="width: 100%; " class="page-header">
				<span class="glyphicon glyphicon-remove pull-right" ng-click="dismiss_error_modal()" />
				<span class="h1">Oops! <small>Looks like something didn't work out.</small></span>
			</div>
			<table class="table table-striped table-bordered table-condensed table-hover">
				<thead>
					<th>Error</th>
					<th>Message</th>
				</thead>
				<tbody>
					<tr ng-repeat="alert in alerts" class="{{alert.type}}">
						<td>{{$index + 1}}</td>
						<td>{{alert.msg}}</td>
					</tr>
				</tbody>
			</table>
			<input type="button" class="center-block" value="Got it!"
					focus-on="show_error_modal"
					ng-keyup="$event.keyCode==27 ? dismiss_error_modal() : null"
					ng-click="dismiss_error_modal()" />
		</div>
	</div>
</div>
