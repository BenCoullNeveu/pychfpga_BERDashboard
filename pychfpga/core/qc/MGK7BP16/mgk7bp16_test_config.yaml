# Notes:
#     - Semicolumns must be followed by a space
#     - Floats must have a decimal point *AND* an exponent sign if an exponent is used (i.e. 10.0 and 10.e+3 is valid, 10e3, 10.e3, 10e+3 are all invalid)
aliases:
comment: |
    This is a long note

    That extends many lines
        this is indented more

# test_results_folder: './test_results'
test_results_folder: '../../../../../crate_qc'
model_number: ['MGK7BP16']
xformat: ['pdf']  # Output formats for the test reports. xml is always saved.

# DEBUGGING options
debug:
    default_model: 'MGK7BP16'
    default_serial: None
    no_date: false


?: &default_fpga_array
    iceboards: 183
    mdns_delay: 1


test_list:
    # This list all the tests that will be done my the test software, in the proper order
    # path is the argument given to nose to find the test fucntion, in the form of module_path:function or module_path:class.method
    # This path is also the path used by XReport to identify tests results, with the exception that the semicolon ':' is replaced by a dot '.'
    - [ 'clk', {description: 'Clock etc. Readout test',     path: 'mgk7bp16_crate_tests:MGK7BP16CrateTests.clock_test',        required: yes, require_serial_number: yes, dependencies: null}]
    - [ 'sen', {description: 'BP Sensor test',              path: 'mgk7bp16_crate_tests:MGK7BP16CrateTests.sensor_test',       required: no,  require_serial_number: yes, dependencies: null}]
    - [ 'qsf', {description: 'QSFP Connector test',         path: 'mgk7bp16_crate_tests:MGK7BP16CrateTests.qsfp_test',         required: yes, require_serial_number: yes, dependencies: null}]
    - [ 'res', {description: 'Board Reset test',            path: 'mgk7bp16_crate_tests:MGK7BP16CrateTests.reset_test',        required: yes, require_serial_number: yes, dependencies: null}]
    - [ 'ber', {description: 'Bit Error Rate test',         path: 'mgk7bp16_crate_tests:MGK7BP16CrateTests.bitErrorRate_test', required: yes, require_serial_number: yes, dependencies: null}]
    - [ 'shu', {description: '256/512 Shuffle test',        path: 'mgk7bp16_crate_tests:MGK7BP16CrateTests.shuffle_test',      required: yes, require_serial_number: yes, dependencies: null}]
    - [ 'mez', {description: 'Mezzanine Ramp test',         path: 'mgk7bp16_crate_tests:MGK7BP16CrateTests.mezzRamp_test',     required: yes, require_serial_number: yes, dependencies: null}]

menu:
    # The menu item will match the user input to either the 'key' field or to the regular expression 'regex'. The matching dictionary is returned.
    # If a regular expression is given, string parameters are replaced by string_param.format(regex_matched_group_list), i.e. '{0}' is replaced by the first matched group etc. The 'key' and 'regex' fields are excluded from this conversion.
    # Entry types are:
    #  test: a test to run. test_tag refers to the test to run in test_list (defined above). A regex entry will be added to match the tets tag and tets path. The description will be taken from the test description if none is provided here.
    #  exit: exit the menu
    #  text: do nothing. The description is shown in the menu if there is one.
    #  board_info: Sets the current board model and serial number. The serial number can be extracted from string parsed by the regex
    #
    - { key: '1', type: test, test_tag: clk}
    - { key: '2', type: test, test_tag: sen}
    - { key: '3', type: test, test_tag: qsf}
    - { key: '4', type: test, test_tag: res}
    - { key: '5', type: test, test_tag: ber}
    - { key: '6', type: test, test_tag: shu}
    - { key: '7', type: test, test_tag: mez}

    - { key: 'S', description: 'Send all new test results data to McGill',                          type: push}
    - { key: 'R', description: 'Generate summary of all tests',                                     type: summary}
    - { key: 'Q', description: 'Exit',                                                              type: exit}
    - {           description: "Start by entering the BP's serial number, then select a test.",     type: text}
    - { regex: '(0\d{2})',                                                                          type: board_info, model: 'MGK7BP16', serial: '{0}', next_key: '1'}  # 0nn are MGK7BP16 Serial number

 

##################################
# Test-specific parameters
##################################

crate_tests:
    setup:
    
    bitErrorRate_test:
        period: 60
        bp_limit: 1e-10
        qsfp_limit: 1e-10
        gpu_limit: 50

    reset_test:
        arm_sleep_time: 30 # ~20 secs
        pow_sleep_time: 60 # ~40 secs , board 9 crate 18 ~50 secs

    qsfp_test:

    sensor_test:
        voltage_limits: [3, 3.5]
        current_limits: [15, 20]
        temp_limit: 90

    clock_test:
        max_time_diff: 50000000
        limits: [9999998, 10000002]

    shuffle_test:
        time_source: 'bp_trig'
        repeat_test: 5

    mezzRamp_test:
