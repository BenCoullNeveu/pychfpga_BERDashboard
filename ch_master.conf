#===============================================================================
#===============================================================================
#==    GPU SETTINGS
#===============================================================================
#===============================================================================

[gpu]
  base_listen_port = 41001   # The starting port to listen on for GPU connections.
  n_gpus = 16                # The total number of GPU systems (nodes).
  n_expected_gpus = 16        # The number of nodes we expect to be working
                             # Should never be lower than the number of possibly
                             # working nodes at this point.
                             # This value will be dynamically set at some point.
  gpu_intergration_period =  8388608 #4194304  # The number of FPGA (FFT'd) samples in a frame.

#===============================================================================
#===============================================================================
#==    DATA ACQUISITION
#===============================================================================
#===============================================================================

[acq]
  base_path         = /data/untransposed/  # Aquisitions off this path.
  curfile           = /data/untransposed/ch_master.cur # A symlink to 
                                                  # the current directory being 
                                                  # written to.
  livefile          = /mnt/agogo/livedata/live.h5
  frames_per_file    = 1024     # Number of frames before starting a new file.
                                # 1024 is optimal for the transpose downstream.
  frames_per_livefile = 256     # Number of frames to store in the livedata.
                                # Old frames get overwritten.
  n_frame_buf        = 12       # Number of frame buffers to keep in memory.
  producer_max_range = 3        # The max range of frames which can be filled by the
                                # GPU nodes. Used to deal with the fact the timing between
                                # nodes can be different due to buffering.
  fpga_count_max     = 4294967295  # The maximum possible FPGA count value.

  acq_loop_poll_rate = 2   #Polling rate in seconds in loop for fpga hk and gain checking  

  [[fpga_hk]]
    rate            = 20         # How often, in seconds, to poll FPGA.
