#===============================================================================
#===============================================================================
#==    GPU SETTINGS
#===============================================================================
#===============================================================================

[gpu]
   ip_address    = 127.0.0.1  #Where GPU will send data
   board_num     = 0          #Which GPU board to use



  

#===============================================================================
#===============================================================================
#==    DATA ACQUISITION
#===============================================================================
#===============================================================================

[acq]
  base_path         = /drives/0/data/    # All data directories will be off this path.
  curfile           = /drives/0/data/ch_master.cur # A symbolic link to the current
                                # directory being written to.
  frames_per_file   = 360       # Number of frames before starting a new file.
  len_frame_buf     = 2         # Number of frame buffers to keep in memory:
                                # should be at least two: one for reading and
                                # one for writing (two is probably enough).

  #-----------------------------------------------------------------------------
  # Settings for reading UDP packets from FPGA.
  #-----------------------------------------------------------------------------

  [[udp]]
    port            = 41001     # Port for reading UDP packets.
    max_len         = 32768     # Largest packet size.
    buf_len         = 5         # Number of FPGA frames that can be buffered.
    spf             = 4        # Number of samples to be integrated into one
                                # frame.

  [[fpga_hk]]
    # This is not being used yet. Currently only ambient is being written,
    # but not using this .conf information. To be added.
    [[[channel]]]
      t_adc_ambient = 0
      t_adc_chip1   = 1
      t_adc_chip2   = 2

  #-----------------------------------------------------------------------------
  # Settings for ADC-to-serial housekeeping.
  #-----------------------------------------------------------------------------

  [[serial]]
    disable         = 1   # Set to non-zero if you have no ADC-to-serial.
    path            = "/dev/ttyUSB0"
    timeout         = 0.5       # Seconds to wait on serial read before fail.

    # List of channels that are read. The format is:
    #   channel_name = <adc_number>, <cal_id>
    # where <cal_id> refers to a calibration listed under acq.cal
    # NOTE: currently these are not being used: the data are simply written to
    # an array of 
    [[[channel]]]
      t_amp1        = 0, atmel_adc_therm
      t_amp2        = 1, atmel_adc_therm
      t_amp3        = 2, atmel_adc_therm
      t_amp4        = 3, atmel_adc_therm
      t_amp5        = 4, atmel_adc_therm
      t_amp6        = 5, atmel_adc_therm
      t_amp7        = 6, atmel_adc_therm
      t_amp8        = 7, atmel_adc_therm


  #-----------------------------------------------------------------------------
  # Calibrations used by housekeeping channels.
  # The calibrations can contain any key/value pairs that might be needed for
  # calibration. However, the following keys _must_ appear:
  # - formula : The formula needed for doing the calibration, e.g., "a * X + b"
  # - units : The units of the final result, e.g., "K".
  #-----------------------------------------------------------------------------

  [[cal]]
    # Thermistor + Atmel ADC (part no. = MF51E103E3950)
    [[[atmel_adc_therm]]]
      formula       = '''(log(r_th / r_0) / b + 1 / t_0)^(-1); where 
                         r_th = r_d * (v_cc - v_m) / v_m and
                         v_m = X * v_ref / 2^n - v_ref * v_ros'''
      units         = K
      v_ref         = 1                 # Atmel ADC reference voltage
      v_ros         = 0.045             # Atmel ADC offset ?
      v_cc          = 3.3               # Atmel Vcc (top of resistor divider)
      b             = 3900              # thermistor beta value
      r_0           = 10000             # thermistor resistance at t_0
      t_0           = 298.15            # thermistor reference temperature
      n             = 12                # number of bits in the Atmel ADC
      r_d           = 1000              # resistor divider value 
      part_no       = MF51E103E3950     # part number for the thermistor
