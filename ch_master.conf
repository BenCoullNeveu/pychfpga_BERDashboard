# Configuration for ch_master.py. Only edit this file if you know what you are
# doing!

#===============================================================================
#===============================================================================
#==   GLOBAL SETTINGS
#===============================================================================
#===============================================================================

n_antenna   = 8         # Number of antenna receivers.
n_freq      = 1024      # Number of frequency bins.




#===============================================================================
#===============================================================================
#==    FPGA SETTINGS
#===============================================================================
#===============================================================================

[fpga]
  ip_address    = 10.10.10.11
  port          = 41000     # Ethernet port number for FPGA communication.
  samp_freq     = 800       # MHz
  ref_freq      = 10e6      # Units?
  int_period    = 0.25      # FPGA integration period

  # Delay values for the ADC: SN0001 KC705 FMC700, Rev. 2.
  # The first 8 values are delays for bits 0 to 7; the eigth value is the delay
  # for the clock line.
  [[adc_delay]]
    ch00 = 13, 10,  9, 10,  9, 10,  9,  9
    ch01 =  7,  7,  7,  7,  7,  7,  7,  7
    ch02 = 11, 11,  8,  9,  7,  8,  8,  7
    ch03 =  6,  6,  6,  6,  6,  6,  6,  6
    ch04 = 14, 14, 14, 14, 14, 14, 14, 14
    ch05 = 14, 14, 14, 14, 14, 14, 14, 14
    ch06 = 13, 13, 13, 13, 13, 13, 13, 13
    ch07 =  0,  0,  0,  0,  0,  0,  0,  0



  

#===============================================================================
#===============================================================================
#==    DATA ACQUISITION
#===============================================================================
#===============================================================================

[acq]
  base_path         = /data/    # All data directories will be off this path.
  frames_per_file   = 1000      # Number of frames before starting a new file.
  len_frame_buf     = 2         # Number of frame buffers to keep in memory:
                                # should be at least two: one for reading and
                                # one for writing (two is probably enough).

  #-----------------------------------------------------------------------------
  # Settings for reading UDP packets from FPGA.
  #-----------------------------------------------------------------------------

  [[udp]]
    port            = 41001     # Port for reading UDP packets.
    max_len         = 32768     # Largest packet size.
    buf_len         = 5         # Number of FPGA frames that can be buffered.


  #-----------------------------------------------------------------------------
  # Settings for ADC-to-serial housekeeping.
  #-----------------------------------------------------------------------------

  [[serial]]
    path            = "/dev/ttyUSB0"
    n_adc           = 8         # Number of ADC's connected to serial device.

    # List of channels that are read. The format is:
    #   channel_name = <adc_number>, <cal_id>
    # where <cal_id> refers to a calibration listed under acq.cal
    [[[channel]]]
      t_amp1        = 0, amtel_adc_therm
      t_amp2        = 1, amtel_adc_therm
      t_amp3        = 2, amtel_adc_therm
      t_amp4        = 3, amtel_adc_therm
      t_amp5        = 4, amtel_adc_therm
      t_amp6        = 5, amtel_adc_therm
      t_amp7        = 6, amtel_adc_therm
      t_amp8        = 7, amtel_adc_therm


  #-----------------------------------------------------------------------------
  # Calibrations used by housekeeping channels.
  #-----------------------------------------------------------------------------

  [[cal]]
    # Thermistor + Amtel ADC (part no. = MF51E103E3950)
    [[[amtel_adc_therm]]]
      v_ref         = 1
      v_ros         = 0.045
      v_cc          = 3.3
      B             = 3900
      R_0           = 10000
      T_0           = 398.15
      n             = 12
      R_d           = 1000
      part_no       = MF51E103E3950
