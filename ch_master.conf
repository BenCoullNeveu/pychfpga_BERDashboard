#===============================================================================
#===============================================================================
#==   GLOBAL SETTINGS
#===============================================================================
#===============================================================================

n_antenna   = 16         # Number of antenna receivers.
n_freq      = 1024      # Number of frequency bins.

# A comment to be inserted into the header.
comment     = "Now running the daemonised version."



#===============================================================================
#===============================================================================
#==    FPGA SETTINGS
#===============================================================================
#===============================================================================

[fpga]
  ip_address    = 10.10.10.11
  port          = 41000     # Ethernet port number for FPGA communication.
  rec_port      = 41001
  samp_freq     = 800       # MHz
  ref_freq      = 10e6      # Hz
  #int_period    = 0.125     # FPGA integration period
  fft_shift     = 1023        # 2^5 - 1 -> old, might be ideal.  2^10-1 safest, but add a bit of noise
  gain     = 27         # Change to a filename?
  data_width = 4       # number of bits 4/8 should always be 4
  group_frames = 4     # how many frames per packet sent to gpu
  enable_gpu_link = 1  # Whether to enable sending data to the gpu
  host_ip = 10.10.10.200          # ip address of machine controlling fpga
  gain_table_pkl = gains.pkl

  # Delay values for the ADC: SN0037 ICE Board, Rev. 2.
  # The first 8 values are delays for bits 0 to 7; the eigth value is the delay
  # for the clock line. need to add the seconds set of 8 delays for each channel
  [[adc_delay]]
    ch00 = 16, 16,  16, 16,  16, 16,  16, 16, 3,3,3,3,3,3,3,3
    ch01 =  7,  7,  7,  7,  7,  7,  7,  7, 3,3,3,3,3,3,3,3
    ch02 = 22, 22,  22,  22,  22,  22,  22,  22, 3,3,3,3,3,3,3,3
    ch03 =  19,  19,  19,  19,  19,  19,  19,  19, 3,3,3,3,3,3,3,3
    ch04 = 15, 15, 15, 15, 15, 15, 15, 15, 3,3,3,3,3,3,3,3
    ch05 = 14, 13, 14, 14, 13, 14, 15, 14, 3,3,3,3,3,3,3,3
    ch06 = 18, 18, 18, 18, 18, 18, 18, 18, 3,3,3,3,3,3,3,3
    ch07 =  17,  17,  17,  17,  17,  17,  17,  17, 4,4,4,4,4,4,4,4
    ch08 =  15,  17,  15,  18,  17,  14,  17,  15, 3,3,3,3,3,3,3,3
    ch09 =  16,  16,  16,  16,  16,  16,  16,  16, 4,4,4,4,4,4,4,4
    ch10 =  20,  20,  20,  20,  20,  20,  20,  20, 3,3,3,3,3,3,3,3
    ch11 =  18,  18,  18,  18,  18,  18,  18,  18, 3,3,3,3,3,3,3,3
    ch12 =  15,  15,  15,  15,  15,  15,  15,  15, 3,3,3,3,3,3,3,3
    ch13 =  18,  18,  18,  18,  18,  18,  18,  18, 3,3,3,3,3,3,3,3
    ch14 =  18,  18,  18,  18,  18,  18,  18,  18, 3,3,3,3,3,3,3,3
    ch15 =  16,  16,  16,  16,  16,  16,  16,  16, 3,3,3,3,3,3,3,3    

