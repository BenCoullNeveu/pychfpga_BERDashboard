connection_config:
    prog: 1                 # 0 - do not reprogram, 1 - reprogram if outdated, 2 - always reprogram
    mode: 'corr8'          # Do not change for a single board
    hwm: 'crs 52:1'           # For a different board change the serial number

test_config:
    loglevelconn: "ERROR"   # Log level during connection to the board
    logleveltest: "DEBUG"   # Log level during tests
    conn_scope: "class"     # Select "function" to re-establish connection for each test or
                            # "class" if you want to reuse connection.
    only_plot: False              #Don't compare results, only plot them  
    platform: "ICE-4bit-r"
    global_postscaler: range(IDENTITY_POSTSCALER - 1, IDENTITY_POSTSCALER + 2) #range(SCALER_SHIFT - INPUT_WIDTH - IMPLICIT_SHIFT + 1, SCALED_WIDTH - IMPLICIT_SHIFT)
    global_frame_cnt: [100, 30000]
    alternating_gain:
        period: range(1, 20, 2)
    constant_gain:
        gain: [3, 65535]
        #gain: [-3, 32767]
    rounding:
        value: [-8, 7]
    double_resolution_capture:
        postscaler: range(12, 22)
    averages:
        num_frames: [120]
        postscaler_range: ((IDENTITY_POSTSCALER - CAPTURE_WIDTH, IDENTITY_POSTSCALER + CAPTURE_WIDTH),)